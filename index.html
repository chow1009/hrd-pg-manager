const KEY="hrd_pg_full_v1";
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}};
let db=load()||{tenants:seed.tenants, payments:[], expenses:[], complaints:[], notices:[]};
const $=s=>document.querySelector(s);
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:0});
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const prop=()=>$("#property").value;
const tenants=()=>db.tenants.filter(t=>t.property===prop());
function roomCount(list){return new Set(list.map(t=>t.room).filter(Boolean)).size}
function getDues(t){return Number(t.dues||0)-db.payments.filter(p=>p.tenantId===t.id).reduce((s,p)=>s+Number(p.amount||0),0)}
function nav(view){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===view));render(view)}
function render(view="dashboard"){
  const list=tenants();
  const totalRent=list.reduce((s,t)=>s+Number(t.rent||0),0);
  const pending=list.reduce((s,t)=>s+Math.max(0,getDues(t)),0);
  $("#cards").innerHTML=[
    ["Tenants",list.length],["Rooms",roomCount(list)],["Monthly Rent",money(totalRent)],["Pending Dues",money(pending)]
  ].map(x=>`<div class="card"><span>${x[0]}</span><b>${x[1]}</b></div>`).join("");
  if(view==="dashboard"){
    const top=[...list].sort((a,b)=>getDues(b)-getDues(a)).slice(0,12);
    $("#content").innerHTML=`<div class="panel"><h2>Dashboard</h2><p class="muted">${list.length} tenants imported from the 15 Sep report.</p>
      <div class="quick"><button onclick="nav('tenants')">Tenants</button><button onclick="nav('payments')">Record Payment</button><button onclick="nav('expenses')">Add Expense</button><button onclick="nav('complaints')">Complaint</button></div>
      </div><div class="panel"><h2>Pending Dues</h2>${tenantTable(top,true)}</div>`;
  }else if(view==="tenants"){
    $("#content").innerHTML=`<div class="panel"><div class="panel-head"><h2>Tenants</h2><input id="search" placeholder="Search name, room or phone"></div><div id="tenantBody">${tenantTable(list,false)}</div></div>`;
    $("#search").oninput=e=>$("#tenantBody").innerHTML=tenantTable(list.filter(t=>(t.name+" "+t.room+" "+t.phone).toLowerCase().includes(e.target.value.toLowerCase())),false);
  }else if(view==="payments"){paymentsView()}
  else if(view==="expenses"){expensesView()}
  else if(view==="complaints"){complaintsView()}
  else if(view==="rooms"){roomsView()}
  else if(view==="ai"){aiView()}
}
function tenantTable(list,compact){
  if(!list.length)return `<div class="empty">No tenants found.</div>`;
  return `<div class="tablewrap"><table><thead><tr><th>Name</th><th>Room</th><th>Phone</th><th>Rent</th><th>Due</th>${compact?"":"<th>Action</th>"}</tr></thead><tbody>${list.map(t=>`<tr>
  <td><strong>${esc(t.name)}</strong><div class="muted">${esc(t.property)}</div></td><td>${esc(t.room||"-")}<div class="muted">${esc(t.sharing||"")}</div></td><td>${esc(t.phone||"-")}</td>
  <td>${money(t.rent)}</td><td class="${getDues(t)>0?'danger':'ok'}">${money(Math.max(0,getDues(t)))}</td>${compact?"":`<td><button class="small" onclick="openPayment('${t.id}')">Payment</button></td>`}</tr>`).join("")}</tbody></table></div>`;
}
function paymentsView(){
 $("#content").innerHTML=`<div class="panel"><div class="panel-head"><h2>Rent Payments</h2><button onclick="openPayment()">+ Record Payment</button></div>
 <div class="tablewrap"><table><thead><tr><th>Date</th><th>Tenant</th><th>Amount</th><th>Mode</th><th>Note</th></tr></thead><tbody>
 ${db.payments.slice().reverse().map(p=>{const t=db.tenants.find(x=>x.id===p.tenantId);return `<tr><td>${esc(p.date)}</td><td>${esc(t?.name||"")}</td><td>${money(p.amount)}</td><td>${esc(p.mode)}</td><td>${esc(p.note)}</td></tr>`}).join("")||'<tr><td colspan="5" class="empty">No payments recorded yet.</td></tr>'}
 </tbody></table></div></div>`;
}
function expensesView(){
 $("#content").innerHTML=`<div class="panel"><div class="panel-head"><h2>Expenses</h2><button onclick="addExpense()">+ Add Expense</button></div>
 <div class="tablewrap"><table><thead><tr><th>Date</th><th>Category</th><th>Amount</th><th>Note</th></tr></thead><tbody>
 ${db.expenses.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.category)}</td><td>${money(x.amount)}</td><td>${esc(x.note)}</td></tr>`).join("")||'<tr><td colspan="4" class="empty">No expenses yet.</td></tr>'}
 </tbody></table></div></div>`;
}
function complaintsView(){
 $("#content").innerHTML=`<div class="panel"><div class="panel-head"><h2>Complaints</h2><button onclick="addComplaint()">+ Complaint</button></div>
 <div class="tablewrap"><table><thead><tr><th>Date</th><th>Tenant</th><th>Issue</th><th>Status</th></tr></thead><tbody>
 ${db.complaints.slice().reverse().map(x=>{const t=db.tenants.find(y=>y.id===x.tenantId);return `<tr><td>${esc(x.date)}</td><td>${esc(t?.name||"")}</td><td>${esc(x.issue)}</td><td>${esc(x.status)}</td></tr>`}).join("")||'<tr><td colspan="4" class="empty">No complaints yet.</td></tr>'}
 </tbody></table></div></div>`;
}
function roomsView(){
 const by={}; tenants().forEach(t=>(by[t.room]??=[]).push(t));
 $("#content").innerHTML=`<div class="panel"><h2>Rooms & Beds</h2>${Object.keys(by).sort().map(r=>`<div class="room"><b>${esc(r)}</b><span>${by[r].length} tenant(s)</span></div>`).join("")||'<div class="empty">No rooms.</div>'}</div>`;
}
function aiView(){
 $("#content").innerHTML=`<div class="panel"><h2>AI PG Manager</h2><p class="muted">Try: “who has the highest dues”, “show occupancy”, “total collection”, or “vacant rooms”.</p><div class="airow"><input id="aiq" placeholder="Ask about this property"><button onclick="askAI()">Ask</button></div><div id="air" class="airesult"></div></div>`;
}
function askAI(){
 const q=$("#aiq").value.toLowerCase(), list=tenants(), r=$("#air");
 if(q.includes("highest")||q.includes("due")){const top=[...list].sort((a,b)=>getDues(b)-getDues(a)).slice(0,10);r.innerHTML=tenantTable(top,true);return}
 if(q.includes("occupancy")){r.innerHTML=`<p>${list.length} tenants across ${roomCount(list)} occupied rooms.</p>`;return}
 if(q.includes("collection")){r.innerHTML=`<p>Total imported collection: <b>${money(list.reduce((s,t)=>s+Number(t.collection||0),0))}</b></p>`;return}
 if(q.includes("vacant")){r.innerHTML=`<p>This V1 uses imported occupied-room data; it does not invent bed inventory that isn't in the report.</p>`;return}
 r.innerHTML="<p>I can answer about dues, occupancy and collections. Try a simpler question.</p>";
}
function openPayment(id){
 const list=tenants();
 const tid=id||list[0]?.id;
 const tlist=list.map(t=>`<option value="${t.id}" ${t.id===tid?"selected":""}>${esc(t.name)} — ${esc(t.room)}</option>`).join("");
 const amount=prompt("Payment amount (₹):");
 if(amount===null)return;
 const n=Number(amount); if(!n||n<=0)return alert("Enter a valid amount.");
 const tenantId=prompt("Tenant ID or use current tenant: "+tid,tid)||tid;
 const t=db.tenants.find(x=>x.id===tenantId)||list.find(x=>x.id===tid);
 if(!t)return alert("Tenant not found.");
 db.payments.push({tenantId:t.id,amount:n,date:new Date().toISOString().slice(0,10),mode:"Cash/Online",note:"Entered in HRD PG Manager"});
 save();render("payments");
}
function addExpense(){
 const cat=prompt("Expense category (electricity/maintenance/etc.)"); if(cat===null)return;
 const amount=Number(prompt("Amount (₹):")); if(!amount)return;
 const note=prompt("Note")||"";
 db.expenses.push({date:new Date().toISOString().slice(0,10),category:cat,amount,note});save();render("expenses");
}
function addComplaint(){
 const list=tenants(); const name=prompt("Enter tenant name"); if(!name)return;
 const t=list.find(x=>x.name.toLowerCase()===name.toLowerCase())||list[0];
 const issue=prompt("Complaint / issue"); if(!issue)return;
 db.complaints.push({tenantId:t.id,issue,status:"Open",date:new Date().toISOString().slice(0,10)});save();render("complaints");
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-view]");if(b)nav(b.dataset.view)});
$("#property").innerHTML=seed.properties.map(p=>`<option>${esc(p)}</option>`).join("");
$("#property").onchange=()=>render(document.querySelector(".nav button.active")?.dataset.view||"dashboard");
render();
window.nav=nav;window.openPayment=openPayment;window.addExpense=addExpense;window.addComplaint=addComplaint;window.askAI=askAI;
</script>
</body></html>
