<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>HRD PG Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f3f6fa;color:#0f172a}
header{position:sticky;top:0;z-index:10;background:#0f172a;color:#fff;padding:16px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.brand small{display:block;font-size:11px;letter-spacing:1.4px;opacity:.7}.brand h1{margin:2px 0 0;font-size:21px}
main{max-width:1150px;margin:auto;padding:14px}.tools{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-bottom:12px}
select,input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:12px;background:#fff;font-size:15px;outline:none}
.nav{display:flex;gap:8px;overflow:auto;margin:10px 0 14px}.nav button{border:0;border-radius:11px;padding:10px 14px;background:#e2e8f0;font-weight:700;white-space:nowrap}.nav button.active{background:#0f172a;color:#fff}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 12px #0000000b}.card .label{font-size:12px;color:#64748b}.card .value{font-size:22px;font-weight:800;margin-top:4px}
.panel{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 12px #0000000b}.panel h2{font-size:17px;margin:0 0 10px}.muted{font-size:12px;color:#64748b}
.tenant-list{display:grid;gap:10px}.tenant{border:1px solid #e2e8f0;border-radius:14px;padding:14px}.topline{display:flex;justify-content:space-between;gap:12px}.name{font-size:17px;font-weight:800}.meta{font-size:12px;color:#64748b;margin-top:4px}.phone{font-size:12px;color:#334155;margin-top:5px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.metric{background:#f8fafc;border-radius:10px;padding:9px}.metric span{display:block;font-size:10px;color:#64748b}.metric b{display:block;font-size:13px;margin-top:2px}
.due{color:#b91c1c}.clear{color:#15803d}.count{background:#e2e8f0;padding:3px 7px;border-radius:999px;font-size:11px}
.empty{text-align:center;padding:30px;color:#64748b}
@media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}.tools{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.topline{align-items:flex-start}}
</style>
</head>
<body>
<header><div class="brand"><small>HRD MEN'S PG</small><h1>PG Manager</h1></div></header>
<main>
<section class="tools">
<select id="property"></select>

</section>

</section>
<section id="cards" class="cards"></section>
<section id="content"></section>
</main>

const state={property:DATA.properties[0]||"",search:"",view:"dashboard"};
const $=s=>document.querySelector(s);
const money=n=>"₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:0});
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"": "&quot;","'":"&#039;"}[m]));
function propRows(){return DATA.tenants.filter(t=>t.property===state.property)}
function filtered(){const q=state.search.trim().toLowerCase();return propRows().filter(t=>!q||[t.name,t.room,t.phone].map(v=>String(v||"")).join(" ").toLowerCase().includes(q))}
function cards(){
 const a=propRows(), dues=a.reduce((x,t)=>x+Number(t.dues||0),0), col=a.reduce((x,t)=>x+Number(t.collection||0),0), rent=a.reduce((x,t)=>x+Number(t.rent||0),0);
 $("#cards").innerHTML=[["Tenants",a.length],["Monthly Rent",money(rent)],["Pending Dues",money(dues)],["Collection",money(col)]].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join("");
}
function tenantCards(list){
 if(!list.length)return '<div class="empty">No tenants found.</div>';
 return '<div class="tenant-list">'+list.map((t,i)=>`<article class="tenant">
 <div class="topline"><div><div class="name">${esc(t.name||"Unnamed Tenant")}</div><div class="meta">Room: <b>${esc(t.room||"-")}</b> · ${esc(t.sharing||"")}</div><div class="phone">${esc(t.phone||"Phone not available")}</div></div><div class="count">${i+1}</div></div>
 <div class="metrics"><div class="metric"><span>Rent</span><b>${money(t.rent)}</b></div><div class="metric"><span>Pending</span><b class="${Number(t.dues)>0?"due":"clear"}">${money(t.dues)}</b></div><div class="metric"><span>Collection</span><b>${money(t.collection)}</b></div><div class="metric"><span>Last payment</span><b>${esc(t.last_payment||"-")}</b></div></div>
 </article>`).join("")+'</div>';
}
function render(){
 cards();
 document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===state.view));
 const list=filtered();
 if(state.view==="dashboard"){
  const top=propRows().filter(t=>Number(t.dues)>0).sort((a,b)=>Number(b.dues)-Number(a.dues)).slice(0,10);
  $("#content").innerHTML=`<div class="panel"><h2>Dashboard</h2><div class="muted">${propRows().length} tenant records loaded from hrd 15sep.xlsx.</div></div><div class="panel"><h2>Top pending dues</h2>${tenantCards(top)}</div>`;
 }else if(state.view==="tenants"){
  $("#content").innerHTML=`<div class="panel"><h2>All Tenants <span class="count">${list.length}</span></h2>${tenantCards(list)}</div>`;
 }else{
  const due=list.filter(t=>Number(t.dues)>0).sort((a,b)=>Number(b.dues)-Number(a.dues));
  $("#content").innerHTML=`<div class="panel"><h2>Pending Dues <span class="count">${due.length}</span></h2>${tenantCards(due)}</div>`;
 }
}
$("#property").innerHTML=DATA.properties.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join("");
$("#property").value=state.property;
$("#property").onchange=e=>{state.property=e.target.value;render()};
$("#search").oninput=e=>{state.search=e.target.value;render()};
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});
render();
</script>
