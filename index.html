<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<title>HRD PG Manager</title>
</head>
<body>
<div id="app">
  <header class="top">
    <div>
      <div class="eyebrow">HRD MEN'S PG</div>
      <h1>PG Manager</h1>
    </div>
    <button id="installBtn" class="ghost hidden">Install</button>
  </header>

  <main>
    <section class="toolbar">
      <select id="property"></select>
      <input id="search" placeholder="Search tenant, room or phone">
    </section>

    <section class="cards" id="cards"></section>

    <nav class="tabs">
      <button class="tab active" data-view="dashboard">Dashboard</button>
      <button class="tab" data-view="tenants">Tenants</button>
      <button class="tab" data-view="dues">Pending Dues</button>
    </nav>

    <section id="content"></section>
  </main>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
