<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>HRD PG Manager</title><style>body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#f3f6fb;color:#101828}header{background:#0b1220;color:#fff;padding:16px;position:sticky;top:0;z-index:5}header small{display:block;opacity:.7}header b{font-size:22px}main{max-width:1400px;margin:auto;padding:14px}.toolbar,.nav,.actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar{margin-bottom:12px}.toolbar>*{min-width:180px;flex:1}input,select,button{font:inherit;padding:10px 12px;border:1px solid #d0d5dd;border-radius:10px;background:#fff}button{font-weight:700;cursor:pointer}.primary{background:#1d4ed8;color:#fff}.nav{overflow:auto;margin-bottom:14px}.nav button.active{background:#111827;color:#fff}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}.card,.panel{background:#fff;border:1px solid #e4e7ec;border-radius:15px;padding:14px}.k,.muted{font-size:12px;color:#667085}.v{font-size:23px;font-weight:800}.table{overflow:auto}table{width:100%;min-width:950px;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;font-size:13px}th{background:#fafbfc}.danger{color:#b42318;font-weight:700}.ok{color:#067647;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.room{border:1px solid #e4e7ec;border-radius:12px;padding:11px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.modalbox{width:min(700px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:900px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}</style></head><body><header><small>HRD MEN'S PG</small><b>PG Manager</b></header><main><div class="toolbar"><select id="property"></select><input id="search" placeholder="Search tenant, room, phone or property"><div class="actions"><button class="primary" onclick="addPayment()">+ Payment</button><button onclick="addExpense()">+ Expense</button><button onclick="addComplaint()">+ Complaint</button></div></div><div class="nav" id="nav"></div><section id="cards" class="cards"></section><section id="content"></section></main><div id="modal" class="modal"><div class="modalbox"><div class="toolbar"><h2 id="mt">Form</h2><button onclick="closeModal()">Close</button></div><div id="mb"></div></div></div><script src="tenant-part-1a.js?v=4"></script><script src="tenant-part-1b.js?v=4"></script><script src="tenant-part-2.js?v=4"></script><script src="tenant-part-3.js?v=4"></script><script>(function(){const PROPS=['HRD Hostel s','Hrd men s Pg 2','Hrd Women s Pg'];const parts=window.HRD_PARTS||[];const MASTER=[];let n=1;for(const p of parts){for(const r of (p[1]||[])){MASTER.push({id:String(n++),property:p[0],name:r[0],room:r[1],sharing:r[2],joined:r[3],phone:r[4],rent:Number(r[5]||0),deposit:Number(r[6]||0),dues:Number(r[7]||0),collection:Number(r[8]||0),lastPayment:r[9]||'',email:r[10]||''})}}const KEY='hrd_pg_final_v5';let db=load(),view='dashboard',q='';const $=id=>document.getElementById(id),money=n=>'₹'+Math.round(Number(n)||0).toLocaleString('en-IN'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.tenants)&&x.tenants.length===MASTER.length)return x}catch(e){}return{properties:PROPS,tenants:MASTER.map(x=>({...x})),payments:[],expenses:[],complaints:[]}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function init(){property.innerHTML='<option value="ALL">All Properties</option>'+PROPS.map(p=>'<option>'+esc(p)+'</option>').join('');nav();render();search.oninput=e=>{q=e.target.value.toLowerCase().trim();render()};property.onchange=render}function nav(){navEl.innerHTML=['dashboard','tenants','rooms','payments','expenses','complaints','reports'].map(v=>'<button class="'+(view===v?'active':'')+'" onclick="setView(\''+v+'\')">'+v[0].toUpperCase()+v.slice(1)+'</button>').join('')}const navEl=document.getElementById('nav');function setView(v){view=v;nav();render()}function tf(){const p=property.value||'ALL';return db.tenants.filter(t=>(p==='ALL'||t.property===p)&&(!q||[t.name,t.room,t.phone,t.property].join(' ').toLowerCase().includes(q)))}function render(){const ts=tf();cards.innerHTML=[['Tenants',ts.length],['Monthly Rent',money(ts.reduce((a,t)=>a+t.rent,0))],['Pending Dues',money(ts.reduce((a,t)=>a+t.dues,0))],['Collections',money(ts.reduce((a,t)=>a+t.collection,0))],['Rooms',new Set(ts.map(t=>t.property+'|'+t.room)).size]].map(x=>'<div class="card"><div class="k">'+x[0]+'</div><div class="v">'+x[1]+'</div></div>').join('');({dashboard:dash,tenants:tenantView,rooms:roomView,payments:paymentView,expenses:expenseView,complaints:complaintView,reports:reportView}[view]||dash)(ts)}function dash(ts){content.innerHTML='<div class="panel"><h2>HRD PG Manager</h2><p class="muted"><b>'+MASTER.length+'</b> tenant records loaded from the HRD workbook.</p></div><div class="panel"><h2>Highest dues</h2><div class="table"><table><tr><th>Name</th><th>Property</th><th>Room</th><th>Due</th></tr>'+[...ts].sort((a,b)=>b.dues-a.dues).slice(0,12).map(t=>'<tr><td><b>'+esc(t.name)+'</b></td><td>'+esc(t.property)+'</td><td>'+esc(t.room)+'</td><td class="'+(t.dues?'danger':'ok')+'">'+money(t.dues)+'</td></tr>').join('')+'</table></div></div>'}function tenantView(ts){content.innerHTML='<div class="panel"><h2>Tenants <span class="muted">'+ts.length+' shown / '+MASTER.length+' total</span></h2><div class="table"><table><tr><th>Name</th><th>Property</th><th>Room</th><th>Phone</th><th>Joined</th><th>Rent</th><th>Due</th><th>Collection</th><th>Action</th></tr>'+ts.map(t=>'<tr><td><b>'+esc(t.name)+'</b></td><td>'+esc(t.property)+'</td><td>'+esc(t.room)+'</td><td>'+esc(t.phone)+'</td><td>'+esc(t.joined)+'</td><td>'+money(t.rent)+'</td><td class="'+(t.dues?'danger':'ok')+'">'+money(t.dues)+'</td><td>'+money(t.collection)+'</td><td><button onclick="editTenant(\''+t.id+'\')">Edit</button></td></tr>').join('')+'</table></div></div>'}function roomView(ts){const m={};ts.forEach(t=>{const k=t.property+'|'+t.room;if(!m[k])m[k]={p:t.property,r:t.room,n:[]};m[k].n.push(t.name)});content.innerHTML='<div class="panel"><h2>Rooms & Occupancy</h2><div class="grid">'+Object.values(m).map(r=>'<div class="room"><b>'+esc(r.r)+'</b><div class="muted">'+esc(r.p)+'</div>'+r.n.map(n=>'<div class="muted">• '+esc(n)+'</div>').join('')+'</div>').join('')+'</div></div>'}function filtered(a){const p=property.value||'ALL';return a.filter(x=>p==='ALL'||x.property===p)}function paymentView(){const a=filtered(db.payments);content.innerHTML='<div class="panel"><h2>Payments</h2><button class="primary" onclick="addPayment()">+ Payment</button><div class="table"><table><tr><th>Date</th><th>Name</th><th>Property</th><th>Amount</th><th>Mode</th></tr>'+a.map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.property)+'</td><td>'+money(x.amount)+'</td><td>'+esc(x.mode)+'</td></tr>').join('')+'</table></div></div>'}function expenseView(){const a=filtered(db.expenses);content.innerHTML='<div class="panel"><h2>Expenses</h2><button class="primary" onclick="addExpense()">+ Expense</button><div class="table"><table><tr><th>Date</th><th>Property</th><th>Category</th><th>Amount</th><th>Note</th></tr>'+a.map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.property)+'</td><td>'+esc(x.category)+'</td><td>'+money(x.amount)+'</td><td>'+esc(x.note)+'</td></tr>').join('')+'</table></div></div>'}function complaintView(){const a=filtered(db.complaints);content.innerHTML='<div class="panel"><h2>Complaints</h2><button class="primary" onclick="addComplaint()">+ Complaint</button><div class="table"><table><tr><th>Date</th><th>Name</th><th>Room</th><th>Issue</th><th>Status</th></tr>'+a.map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.room)+'</td><td>'+esc(x.issue)+'</td><td>'+esc(x.status)+'</td></tr>').join('')+'</table></div></div>'}function reportView(ts){content.innerHTML='<div class="panel"><h2>Report</h2><p>Tenants: <b>'+ts.length+'</b></p><p>Monthly rent: <b>'+money(ts.reduce((a,t)=>a+t.rent,0))+'</b></p><p>Pending dues: <b>'+money(ts.reduce((a,t)=>a+t.dues,0))+'</b></p><p>Collection: <b>'+money(ts.reduce((a,t)=>a+t.collection,0))+'</b></p><button onclick="backup()">Export backup</button></div>'}function editTenant(id){const t=db.tenants.find(x=>x.id===id);mt.textContent='Edit Tenant';mb.innerHTML='<div class="grid2"><label>Name<input id="en" value="'+esc(t.name)+'"></label><label>Phone<input id="ep" value="'+esc(t.phone)+'"></label><label>Room<input id="er" value="'+esc(t.room)+'"></label><label>Rent<input id="erent" type="number" value="'+t.rent+'"></label><label>Due<input id="edue" type="number" value="'+t.dues+'"></label></div><p><button class="primary" onclick="saveTenant(\''+id+'\')">Save</button></p>';modal.classList.add('show')}function saveTenant(id){const t=db.tenants.find(x=>x.id===id);t.name=en.value.trim();t.phone=ep.value.trim();t.room=er.value.trim();t.rent=Number(erent.value||0);t.dues=Number(edue.value||0);save();closeModal();render()}function addPayment(){mt.textContent='Add Payment';mb.innerHTML='<label>Tenant<select id="pt">'+db.tenants.map(t=>'<option value="'+t.id+'">'+esc(t.name)+' — '+esc(t.room)+'</option>').join('')+'</select></label><p><input id="pa" type="number" placeholder="Amount"></p><p><select id="pm"><option>UPI</option><option>Cash</option><option>Bank Transfer</option><option>Card</option></select></p><p><button class="primary" onclick="savePayment()">Save</button></p>';modal.classList.add('show')}function savePayment(){const t=db.tenants.find(x=>x.id===pt.value),a=Number(pa.value||0);if(!t||a<=0)return;t.collection+=a;t.dues=Math.max(0,t.dues-a);db.payments.push({date:new Date().toISOString().slice(0,10),name:t.name,property:t.property,amount:a,mode:pm.value});save();closeModal();render()}function addExpense(){mt.textContent='Add Expense';mb.innerHTML='<label>Property<select id="xp">'+PROPS.map(p=>'<option>'+esc(p)+'</option>').join('')+'</select></label><p><input id="xa" type="number" placeholder="Amount"></p><p><input id="xc" placeholder="Category"></p><p><input id="xn" placeholder="Note"></p><p><button class="primary" onclick="saveExpense()">Save</button></p>';modal.classList.add('show')}function saveExpense(){const a=Number(xa.value||0);if(a<=0)return;db.expenses.push({date:new Date().toISOString().slice(0,10),property:xp.value,category:xc.value||'Other',amount:a,note:xn.value||''});save();closeModal();render()}function addComplaint(){mt.textContent='New Complaint';mb.innerHTML='<label>Tenant<select id="ct">'+db.tenants.map(t=>'<option value="'+t.id+'">'+esc(t.name)+' — '+esc(t.room)+'</option>').join('')+'</select></label><p><input id="ci" placeholder="Issue"></p><p><select id="cs"><option>Open</option><option>In Progress</option><option>Resolved</option></select></p><button class="primary" onclick="saveComplaint()">Save</button>';modal.classList.add('show')}function saveComplaint(){const t=db.tenants.find(x=>x.id===ct.value);if(!t)return;db.complaints.push({date:new Date().toISOString().slice(0,10),name:t.name,property:t.property,room:t.room,issue:ci.value,status:cs.value});save();closeModal();render()}function closeModal(){modal.classList.remove('show')}function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='hrd-pg-backup.json';a.click()}init()})();</script></body></html>
