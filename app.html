<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>HRD PG Manager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#101828}.wrap{max-width:1200px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #10182810}input,select,button{padding:10px 12px;border-radius:9px;border:1px solid #d0d5dd;font:inherit}button{cursor:pointer;font-weight:700}.primary{background:#111827;color:#fff}.muted{color:#667085;font-size:13px}.hide{display:none}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar>*{flex:1;min-width:180px}table{width:100%;border-collapse:collapse;min-width:900px}td,th{padding:9px;border-bottom:1px solid #eee;text-align:left}th{background:#f8fafc}.top{background:#0b1220;color:#fff}.bad{color:#b42318;font-weight:700}.ok{color:#067647;font-weight:700}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><div id="login" class="wrap"><div class="card"><h1>HRD PG Manager</h1><p class="muted">Secure multi-user login</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password" style="margin-top:8px"><div class="row" style="margin-top:10px"><button class="primary" onclick="signIn()">Sign in</button><button onclick="signUp()">Create account</button></div><p id="msg" class="muted"></p></div></div><div id="app" class="hide"><div class="top"><div class="wrap row"><b>HRD PG Manager</b><span id="who" style="margin-left:auto"></span><button onclick="signOut()">Logout</button></div></div><main class="wrap"><div class="grid" id="stats"></div><div class="card"><div class="toolbar"><select id="property"><option value="ALL">All Properties</option></select><input id="q" placeholder="Search tenant name, room, phone…"><button class="primary" onclick="showTenants()">Refresh</button></div></div><div class="card"><div class="row"><button onclick="showTenants()">Tenants</button><button onclick="showPayments()">Payments</button><button onclick="showExpenses()">Expenses</button><button onclick="showComplaints()">Complaints</button></div></div><div id="screen"></div></main></div><script src="tenant-data.js"></script><script>const SB_URL='https://ovthvwesdslgqmqwbndk.supabase.co',SB_KEY='sb_publishable_OWGP-Jn4p4X1HNnEkKbeTA_Nh6Vmkls';const sb=supabase.createClient(SB_URL,SB_KEY);let profile=null,seed=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=n=>'₹'+Math.round(Number(n)||0).toLocaleString('en-IN');function key(p,r,ph){return [p||'',r||'',String(ph||'').replace(/\D/g,'')].join('|')}function nameMap(){const m=new Map();for(const t of (seed?.tenants||[]))m.set(key(t.property,t.room,t.phone),t.name);return m}function displayTenant(t,propertyName,map){return map.get(key(propertyName,t.room,t.phone))||((/^\d+$/.test(String(t.name||'')))?((seed?.tenants||[]).find(x=>x.id==='T'+String(t.id).padStart(4,'0'))?.name||t.name):t.name)}async function signIn(){const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)$('msg').textContent=error.message;else await boot()}async function signUp(){const {error}=await sb.auth.signUp({email:$('email').value,password:$('password').value});$('msg').textContent=error?error.message:'Account created. Check email if required, then sign in.'}async function signOut(){await sb.auth.signOut();location.reload()}async function boot(){try{seed=await window.HRD_SEED_READY}catch(e){$('msg').textContent='Tenant master could not load.';return}const {data:{user}}=await sb.auth.getUser();if(!user)return;$('login').classList.add('hide');$('app').classList.remove('hide');const pr=await sb.from('profiles').select('*').eq('user_id',user.id).single();profile=pr.data;$('who').textContent=(profile?.display_name||user.email)+' · '+(profile?.role||'staff');await loadProps();await refreshStats();await showTenants()}async function loadProps(){const {data:p}=await sb.from('properties').select('*').order('name');$('property').innerHTML='<option value="ALL">All Properties</option>'+(p||[]).map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');$('property').dataset.names=JSON.stringify(Object.fromEntries((p||[]).map(x=>[x.id,x.name])))}async function refreshStats(){const {data:ts}=await sb.from('tenants').select('rent,dues');$('stats').innerHTML=[['Tenants',ts?.length||0],['Monthly Rent',money((ts||[]).reduce((a,x)=>a+Number(x.rent||0),0))],['Pending Dues',money((ts||[]).reduce((a,x)=>a+Number(x.dues||0),0))],['Master Records',seed?.tenants?.length||0]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><h2>${x[1]}</h2></div>`).join('')}async function showTenants(){const {data:ts,error}=await sb.from('tenants').select('*,properties(name)').order('name');if(error){$('screen').innerHTML=`<div class="card">${esc(error.message)}</div>`;return}const map=nameMap(),names=$('property').dataset.names?JSON.parse($('property').dataset.names):{};const p=$('property').value||'ALL',q=($('q').value||'').toLowerCase().trim();const rows=(ts||[]).map(t=>{const pn=t.properties?.name||names[t.property_id]||'';return {...t,_pn:pn,_display:displayTenant(t,pn,map)}}).filter(t=>(p==='ALL'||t.property_id===p)&&(!q||[t._display,t._pn,t.room,t.phone].join(' ').toLowerCase().includes(q)));$('screen').innerHTML=`<div class="card"><h2>Tenants <span class="muted">${rows.length} shown / ${seed.tenants.length} master records</span></h2><div style="overflow:auto"><table><thead><tr><th>Name</th><th>Property</th><th>Room</th><th>Phone</th><th>Joined</th><th>Rent</th><th>Due</th><th>Collection</th></tr></thead><tbody>${rows.map(t=>`<tr><td><b>${esc(t._display)}</b></td><td>${esc(t._pn)}</td><td>${esc(t.room)}</td><td>${esc(t.phone)}</td><td>${esc(t.joined)}</td><td>${money(t.rent)}</td><td class="${Number(t.dues)>0?'bad':'ok'}">${money(t.dues)}</td><td>${money(t.collection)}</td></tr>`).join('')}</tbody></table></div></div>`}async function showPayments(){const {data:p,error}=await sb.from('payments').select('*').order('payment_date',{ascending:false});$('screen').innerHTML=`<div class="card"><h2>Payments</h2>${error?esc(error.message):`<div style="overflow:auto"><table><thead><tr><th>Date</th><th>Tenant</th><th>Amount</th><th>Mode</th></tr></thead><tbody>${(p||[]).map(x=>`<tr><td>${esc(x.payment_date)}</td><td>${esc(x.tenant_name||x.tenantName)}</td><td>${money(x.amount)}</td><td>${esc(x.mode)}</td></tr>`).join('')}</tbody></table></div>`}</div>`}async function showExpenses(){const {data:p,error}=await sb.from('expenses').select('*').order('expense_date',{ascending:false});$('screen').innerHTML=`<div class="card"><h2>Expenses</h2>${error?esc(error.message):`<div style="overflow:auto"><table><thead><tr><th>Date</th><th>Category</th><th>Amount</th><th>Note</th></tr></thead><tbody>${(p||[]).map(x=>`<tr><td>${esc(x.expense_date)}</td><td>${esc(x.category)}</td><td>${money(x.amount)}</td><td>${esc(x.note)}</td></tr>`).join('')}</tbody></table></div>`}</div>`}async function showComplaints(){const {data:p,error}=await sb.from('complaints').select('*').order('created_at',{ascending:false});$('screen').innerHTML=`<div class="card"><h2>Complaints</h2>${error?esc(error.message):`<div style="overflow:auto"><table><thead><tr><th>Date</th><th>Tenant</th><th>Room</th><th>Issue</th><th>Status</th></tr></thead><tbody>${(p||[]).map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.tenant_name)}</td><td>${esc(x.room)}</td><td>${esc(x.issue)}</td><td>${esc(x.status)}</td></tr>`).join('')}</tbody></table></div>`}</div>`}$('property').addEventListener('change',showTenants);$('q').addEventListener('input',()=>showTenants());window.HRD_SEED_READY.then(()=>{});sb.auth.getSession().then(()=>boot());</script></body></html>
