<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HRD PG Manager</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#f5f7fb;color:#101828}header{background:#0b1220;color:#fff;padding:16px;position:sticky;top:0;z-index:2}header small{display:block;opacity:.7;letter-spacing:1px}header b{font-size:22px}main{max-width:1400px;margin:auto;padding:14px}.toolbar,.actions,.nav{display:flex;gap:8px;flex-wrap:wrap}.toolbar{margin-bottom:12px}.toolbar>*{min-width:190px;flex:1}.toolbar select{flex:0 1 260px}input,select,button{font:inherit;padding:10px 12px;border:1px solid #d0d5dd;border-radius:10px;background:#fff}button{font-weight:700;cursor:pointer}.primary{background:#1d4ed8;color:#fff;border-color:#1d4ed8}.nav{overflow:auto;margin-bottom:14px}.nav button.active{background:#111827;color:#fff}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:15px;padding:14px;box-shadow:0 2px 10px #10182808}.k{font-size:12px;color:#667085}.v{font-size:23px;font-weight:800}.muted{font-size:12px;color:#667085}.panel{background:#fff;border:1px solid #e4e7ec;border-radius:15px;padding:14px;margin-bottom:12px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.table{overflow:auto}table{width:100%;min-width:980px;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eef0f3;text-align:left;font-size:13px}th{background:#fafbfc}.danger{color:#b42318;font-weight:700}.ok{color:#067647;font-weight:700}.roomgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.room{border:1px solid #e4e7ec;border-radius:12px;padding:11px}.badge{background:#eef4ff;color:#1d4ed8;border-radius:99px;padding:3px 7px;font-size:11px;font-weight:800}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modal.show{display:flex}.modalbox{width:min(700px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}@media(max-width:1000px){.cards{grid-template-columns:repeat(3,1fr)}.roomgrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}.roomgrid{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.toolbar>*{min-width:140px}}</style></head><body><header><small>HRD MEN'S PG</small><b>PG Manager</b></header><main><div class="toolbar"><select id="property"></select><input id="search" placeholder="Search name, room, phone or property"><div class="actions"><button class="primary" onclick="addPayment()">+ Payment</button><button onclick="addExpense()">+ Expense</button><button onclick="addComplaint()">+ Complaint</button></div></div><div class="nav" id="nav"></div><section id="cards" class="cards"></section><section id="content"></section></main><div id="modal" class="modal"><div class="modalbox"><div class="head"><h2 id="title"></h2><button onclick="closeModal()">Close</button></div><div id="body"></div></div></div><script src="tenant-data.js?v=20260916"></script><script>const KEY='hrd_pg_v4';let seed,db,view='dashboard',q='';const $=x=>document.getElementById(x),money=n=>'₹'+Math.round(Number(n)||0).toLocaleString('en-IN');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function openM(t,b){$('title').textContent=t;$('body').innerHTML=b;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}function props(){$('property').innerHTML='<option value="ALL">All Properties</option>'+seed.properties.map(p=>`<option>${esc(p)}</option>`).join('')}function nav(){let a=['dashboard','tenants','rooms','payments','expenses','complaints','reports'];$('nav').innerHTML=a.map(v=>`<button class="${view===v?'active':''}" onclick="setView('${v}')">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}function setView(v){view=v;nav();render()}function tenants(){let p=$('property').value;return seed.tenants.filter(t=>(p==='ALL'||t.property===p)&&(!q||[t.name,t.room,t.phone,t.property].join(' ').toLowerCase().includes(q)))}function render(){let ts=tenants(),du=ts.reduce((a,t)=>a+t.dues,0),co=ts.reduce((a,t)=>a+t.collection,0),re=ts.reduce((a,t)=>a+t.rent,0),rm=new Set(ts.map(t=>t.property+'|'+t.room)).size;$('cards').innerHTML=[['Tenants',ts.length],['Monthly Rent',money(re)],['Pending Dues',money(du)],['Collections',money(co)],['Rooms',rm]].map(x=>`<div class="card"><div class="k">${x[0]}</div><div class="v">${x[1]}</div></div>`).join('');if(view==='dashboard')dash(ts);else if(view==='tenants')tenantView(ts);else if(view==='rooms')roomView(ts);else if(view==='payments')paymentView();else if(view==='expenses')expenseView();else if(view==='complaints')complaintView();else reportView(ts)}function dash(ts){let top=[...ts].sort((a,b)=>b.dues-a.dues).slice(0,12);$('content').innerHTML=`<div class="panel"><div class="head"><h2>Complete tenant master</h2><span class="muted">${seed.tenants.length} records loaded</span></div><p class="muted">Source: latest HRD tenant workbook. Sensitive Aadhaar/bank/document fields are not shown.</p></div><div class="panel"><h2>Highest dues</h2><div class="table"><table><thead><tr><th>Name</th><th>Property</th><th>Room</th><th>Phone</th><th>Due</th></tr></thead><tbody>${top.map(t=>`<tr><td><b>${esc(t.name)}</b></td><td>${esc(t.property)}</td><td>${esc(t.room)}</td><td>${esc(t.phone)}</td><td class="${t.dues?'danger':'ok'}">${money(t.dues)}</td></tr>`).join('')}</tbody></table></div></div>`}function tenantView(ts){$('content').innerHTML=`<div class="panel"><div class="head"><h2>Tenants</h2><span class="muted">${ts.length} shown</span></div><div class="table"><table><thead><tr><th>Name</th><th>Property</th><th>Room</th><th>Phone</th><th>Joined</th><th>Rent</th><th>Due</th><th>Collection</th><th>Actions</th></tr></thead><tbody>${ts.map(t=>`<tr><td><b>${esc(t.name)}</b><div class="muted">${esc(t.email)}</div></td><td>${esc(t.property)}</td><td>${esc(t.room)}<div class="muted">${esc(t.sharing)}</div></td><td>${esc(t.phone)}</td><td>${esc(t.joined)}</td><td>${money(t.rent)}</td><td class="${t.dues?'danger':'ok'}">${money(t.dues)}</td><td>${money(t.collection)}</td><td><div class="actions"><button onclick="pay('${t.id}')">Pay</button><button onclick="edit('${t.id}')">Edit</button><button onclick="wa('${t.phone}','${String(t.name).replace(/'/g,"\\'")}')">WhatsApp</button></div></td></tr>`).join('')}</tbody></table></div></div>`}function roomView(ts){let m={};ts.forEach(t=>{let k=t.property+'|'+t.room;if(!m[k])m[k]={p:t.property,r:t.room,c:Number((t.sharing.match(/\d+/)||[1])[0]),n:[]};m[k].n.push(t.name)});$('content').innerHTML=`<div class="panel"><h2>Rooms & Occupancy</h2><div class="roomgrid">${Object.values(m).map(r=>`<div class="room"><b>${esc(r.r)}</b> <span class="badge">${r.n.length}/${r.c}</span><div class="muted">${esc(r.p)}</div>${r.n.map(n=>`<div class="muted">• ${esc(n)}</div>`).join('')}</div>`).join('')}</div></div>`}function filtered(a){let p=$('property').value;return a.filter(x=>p==='ALL'||x.property===p)}function paymentView(){let a=filtered(db.payments);$('content').innerHTML=`<div class="panel"><div class="head"><h2>Payments</h2><button class="primary" onclick="addPayment()">+ Payment</button></div><div class="table"><table><tr><th>Date</th><th>Name</th><th>Property</th><th>Amount</th><th>Mode</th></tr>${a.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.name)}</td><td>${esc(x.property)}</td><td>${money(x.amount)}</td><td>${esc(x.mode)}</td></tr>`).join('')}</table></div></div>`}function expenseView(){let a=filtered(db.expenses);$('content').innerHTML=`<div class="panel"><div class="head"><h2>Expenses</h2><button class="primary" onclick="addExpense()">+ Expense</button></div><div class="table"><table><tr><th>Date</th><th>Property</th><th>Category</th><th>Amount</th><th>Note</th></tr>${a.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.property)}</td><td>${esc(x.category)}</td><td>${money(x.amount)}</td><td>${esc(x.note)}</td></tr>`).join('')}</table></div></div>`}function complaintView(){let a=filtered(db.complaints);$('content').innerHTML=`<div class="panel"><div class="head"><h2>Complaints</h2><button class="primary" onclick="addComplaint()">+ Complaint</button></div><div class="table"><table><tr><th>Date</th><th>Name</th><th>Room</th><th>Issue</th><th>Status</th></tr>${a.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.name)}</td><td>${esc(x.room)}</td><td>${esc(x.issue)}</td><td>${esc(x.status)}</td></tr>`).join('')}</table></div></div>`}function reportView(ts){$('content').innerHTML=`<div class="panel"><h2>Report</h2><p>Tenants: <b>${ts.length}</b></p><p>Monthly rent: <b>${money(ts.reduce((a,t)=>a+t.rent,0))}</b></p><p>Pending dues: <b>${money(ts.reduce((a,t)=>a+t.dues,0))}</b></p><p>Collection: <b>${money(ts.reduce((a,t)=>a+t.collection,0))}</b></p><button onclick="backup()">Export backup</button></div>`}function pay(id){let t=seed.tenants.find(x=>x.id===id)||seed.tenants[0];openM('Add Payment',`<div class="grid2"><label class="full">Tenant<select id="pt">${seed.tenants.map(x=>`<option value="${x.id}" ${x.id===t.id?'selected':''}>${esc(x.name)} — ${esc(x.property)} — ${esc(x.room)}</option>`).join('')}</select></label><label>Amount<input id="pa" type="number"></label><label>Mode<select id="pm"><option>UPI</option><option>Cash</option><option>Bank Transfer</option><option>Card</option></select></label><label>Date<input id="pd" type="date" value="${new Date().toISOString().slice(0,10)}"></label></div><p><button class="primary" onclick="savePay()">Save</button></p>`)}function addPayment(){pay()}function savePay(){let t=db.tenants.find(x=>x.id===$('pt').value),a=Number($('pa').value||0);if(!t||a<=0)return;db.payments.push({date:$('pd').value,name:t.name,property:t.property,amount:a,mode:$('pm').value});t.collection+=a;t.dues=Math.max(0,t.dues-a);t.lastPayment=$('pd').value;save();closeModal();render()}function edit(id){let t=db.tenants.find(x=>x.id===id);openM('Edit Tenant',`<div class="grid2"><label>Name<input id="en" value="${esc(t.name)}"></label><label>Phone<input id="ep" value="${esc(t.phone)}"></label><label>Room<input id="er" value="${esc(t.room)}"></label><label>Rent<input id="et" type="number" value="${t.rent}"></label><label>Due<input id="ed" type="number" value="${t.dues}"></label><label>Collection<input id="ec" type="number" value="${t.collection}"></label></div><p><button class="primary" onclick="saveEdit('${id}')">Save</button></p>`)}function saveEdit(id){let t=db.tenants.find(x=>x.id===id);t.name=$('en').value.trim();t.phone=$('ep').value.trim();t.room=$('er').value.trim();t.rent=Number($('et').value||0);t.dues=Number($('ed').value||0);t.collection=Number($('ec').value||0);save();closeModal();render()}function addExpense(){openM('Add Expense',`<div class="grid2"><label>Property<select id="xp">${seed.properties.map(p=>`<option>${esc(p)}</option>`).join('')}</select></label><label>Date<input id="xd" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Category<input id="xc"></label><label>Amount<input id="xa" type="number"></label><label class="full">Note<input id="xn"></label></div><p><button class="primary" onclick="saveExpense()">Save</button></p>`)}function saveExpense(){let a=Number($('xa').value||0);if(a<=0)return;db.expenses.push({property:$('xp').value,date:$('xd').value,category:$('xc').value||'Other',amount:a,note:$('xn').value||''});save();closeModal();render()}function addComplaint(){openM('New Complaint',`<label>Tenant<select id="ct">${seed.tenants.map(t=>`<option value="${t.id}">${esc(t.name)} — ${esc(t.room)}</option>`).join('')}</select></label><p><label>Issue<input id="ci"></label></p><p><label>Status<select id="cs"><option>Open</option><option>In Progress</option><option>Resolved</option></select></label></p><button class="primary" onclick="saveComplaint()">Save</button>`)}function saveComplaint(){let t=db.tenants.find(x=>x.id===$('ct').value);if(!t)return;db.complaints.push({date:new Date().toISOString().slice(0,10),name:t.name,property:t.property,room:t.room,issue:$('ci').value,status:$('cs').value});save();closeModal();render()}function wa(p,n){p=String(p||'').replace(/\D/g,'');if(p)window.open('https://wa.me/91'+p+'?text='+encodeURIComponent('Hello '+n+', this is HRD PG.'),'_blank')}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='hrd-pg-manager-backup.json';a.click()}function save(){localStorage.setItem(KEY,JSON.stringify(db))}async function init(){seed=await window.HRD_SEED_READY;try{db=JSON.parse(localStorage.getItem(KEY))||{properties:seed.properties,tenants:structuredClone(seed.tenants),payments:[],expenses:[],complaints:[]}}catch(e){db={properties:seed.properties,tenants:structuredClone(seed.tenants),payments:[],expenses:[],complaints:[]}}if(!db.tenants||db.tenants.length!==265){db={properties:seed.properties,tenants:structuredClone(seed.tenants),payments:[],expenses:[],complaints:[]};save()}props();nav();render();$('property').onchange=render;$('search').oninput=e=>{q=e.target.value.toLowerCase();render()}}init().catch(e=>{$('content').innerHTML='<div class="panel"><h2>App load error</h2><p>'+esc(e.message)+'</p></div>'});</script></body></html>
