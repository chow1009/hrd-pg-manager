<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>HRD PG Manager</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#101828}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:18px;margin:12px 0}input,select,button{padding:10px;border-radius:9px;border:1px solid #ccc;font:inherit}button{cursor:pointer;font-weight:700}.primary{background:#111827;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.hide{display:none}.muted{color:#667085;font-size:13px}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #eee;text-align:left}.top{background:#0b1220;color:white;padding:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}</style></head><body><div id="login" class="wrap"><div class="card"><h1>HRD PG Manager</h1><p>Secure multi-user login</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><div class="row" style="margin-top:10px"><button class="primary" onclick="signIn()">Sign in</button><button onclick="signUp()">Create account</button></div><p id="msg" class="muted"></p></div></div><div id="app" class="hide"><div class="top"><div class="wrap row"><b>HRD PG Manager</b><span id="who"></span><button onclick="signOut()">Logout</button></div></div><main class="wrap"><div id="stats" class="grid"></div><div class="card"><div class="row"><button onclick="show('tenants')">Tenants</button><button id="usersBtn" onclick="show('users')">Users & Access</button><button onclick="show('properties')">Properties</button><button onclick="migrate()">Migrate this device</button></div></div><div id="screen"></div></main></div><script>const SB_URL='https://ovthvwesdslgqmqwbndk.supabase.co',SB_KEY='sb_publishable_OWGP-Jn4p4X1HNnEkKbeTA_Nh6Vmkls';const sb=supabase.createClient(SB_URL,SB_KEY);let profile=null;const $=id=>document.getElementById(id);const msg=s=>$('msg').textContent=s;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function signIn(){const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)msg(error.message);else await boot()}async function signUp(){const {error}=await sb.auth.signUp({email:$('email').value,password:$('password').value});msg(error?error.message:'Account created. Check email if confirmation is required, then sign in.')}async function signOut(){await sb.auth.signOut();location.reload()}async function boot(){const {data:{user}}=await sb.auth.getUser();if(!user)return;$('login').classList.add('hide');$('app').classList.remove('hide');let r=await sb.from('profiles').select('*').eq('user_id',user.id).single();profile=r.data;$('who').textContent=(profile?.display_name||user.email)+' · '+(profile?.role||'staff');if(profile?.role!=='admin')$('usersBtn').classList.add('hide');await dashboard()}async function dashboard(){const {data:ts}=await sb.from('tenants').select('id,name,property_id,room,rent,dues,collection,phone,sharing,joined,last_payment,email').order('name');const {data:ps}=await sb.from('properties').select('*').order('name');$('stats').innerHTML=`<div class="card"><b>Tenants</b><h2>${ts?.length||0}</h2></div><div class="card"><b>Monthly Rent</b><h2>₹${Math.round((ts||[]).reduce((a,x)=>a+Number(x.rent||0),0)).toLocaleString('en-IN')}</h2></div><div class="card"><b>Pending Dues</b><h2>₹${Math.round((ts||[]).reduce((a,x)=>a+Number(x.dues||0),0)).toLocaleString('en-IN')}</h2></div><div class="card"><b>Properties</b><h2>${ps?.length||0}</h2></div>`;show('tenants')}async function show(which){if(which==='users')return users();if(which==='properties')return properties();const {data:ts}=await sb.from('tenants').select('*,properties(name)').order('name');$('screen').innerHTML=`<div class="card"><h2>Tenants</h2><div style="overflow:auto"><table><thead><tr><th>Name</th><th>Property</th><th>Room</th><th>Phone</th><th>Rent</th><th>Due</th><th>Collection</th></tr></thead><tbody>${(ts||[]).map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.properties?.name)}</td><td>${esc(t.room)}</td><td>${esc(t.phone)}</td><td>₹${Number(t.rent||0).toLocaleString('en-IN')}</td><td>₹${Number(t.dues||0).toLocaleString('en-IN')}</td><td>₹${Number(t.collection||0).toLocaleString('en-IN')}</td></tr>`).join('')}</tbody></table></div></div>`}async function users(){if(profile?.role!=='admin')return;const {data:u}=await sb.from('profiles').select('*').order('email');$('screen').innerHTML=`<div class="card"><h2>Users & Access</h2><p class="muted">Roles: admin, manager, accounts, staff, viewer.</p><table><thead><tr><th>Email</th><th>Name</th><th>Role</th><th>Active</th><th>Save</th></tr></thead><tbody>${(u||[]).map(x=>`<tr><td>${esc(x.email)}</td><td><input id="n_${x.user_id}" value="${esc(x.display_name||'')}"></td><td><select id="r_${x.user_id}">${['admin','manager','accounts','staff','viewer'].map(v=>`<option ${x.role===v?'selected':''}>${v}</option>`).join('')}</select></td><td><input id="a_${x.user_id}" type="checkbox" ${x.active?'checked':''}></td><td><button onclick="saveUser('${x.user_id}')">Save</button></td></tr>`).join('')}</tbody></table></div>`}async function saveUser(id){const {error}=await sb.from('profiles').update({role:$('r_'+id).value,active:$('a_'+id).checked,display_name:$('n_'+id).value,updated_at:new Date().toISOString()}).eq('user_id',id);alert(error?error.message:'Saved');await users()}async function properties(){const {data:p}=await sb.from('properties').select('*').order('name');$('screen').innerHTML=`<div class="card"><h2>Properties</h2>${(p||[]).map(x=>`<p><b>${esc(x.name)}</b></p>`).join('')}<p class="muted">Property access is enforced by the database.</p></div>`}async function migrate(){const raw=localStorage.getItem('hrd_pg_manager_v1');if(!raw)return alert('No existing local app data found on this device.');const d=JSON.parse(raw),ps=await sb.from('properties').select('id,name'),map=Object.fromEntries((ps.data||[]).map(x=>[x.name,x.id]));const rows=(d.tenants||[]).map(t=>({property_id:map[t.property],name:t.name,room:t.room,sharing:t.sharing,joined:t.joined,phone:t.phone,rent:Number(t.rent||0),deposit:Number(t.deposit||0),dues:Number(t.dues||0),collection:Number(t.collection||0),last_payment:t.last_payment||null,email:t.email||null})).filter(x=>x.property_id&&x.name);if(!rows.length)return alert('No tenant records found.');const {error}=await sb.from('tenants').insert(rows);alert(error?error.message:`Migrated ${rows.length} tenants to the cloud.`);await dashboard()}sb.auth.getSession().then(()=>boot());</script></body></html>
