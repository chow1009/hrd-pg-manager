<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><meta name="description" content="HRD PG Manager"><link rel="manifest" href="manifest.json"><title>HRD PG Manager</title><style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#101828;--muted:#667085;--line:#e4e7ec;--ok:#067647;--warn:#b54708;--bad:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.appbar{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#0b1220,#172033);color:#fff;padding:14px 16px}.appbarin{max-width:1400px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand small{display:block;opacity:.65;letter-spacing:1.3px}.brand b{font-size:22px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #d0d5dd;background:#fff;color:#101828;border-radius:10px;padding:9px 12px;font-weight:700}.btn.ghost{background:#ffffff18;color:#fff;border-color:#ffffff2b}.btn.primary{background:#1d4ed8;color:#fff;border-color:#1d4ed8}.wrap{max-width:1400px;margin:auto;padding:14px}.toolbar{display:grid;grid-template-columns:240px 1fr auto;gap:10px;margin-bottom:12px}.field{width:100%;padding:11px 12px;border:1px solid #d0d5dd;border-radius:10px;background:#fff;outline:none}.nav{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.nav button{border:0;background:#e9edf3;color:#344054;border-radius:10px;padding:10px 13px;font-weight:800;white-space:nowrap}.nav button.active{background:#111827;color:#fff}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 2px 10px #10182808}.card .k{font-size:12px;color:var(--muted)}.card .v{font-size:24px;font-weight:800;margin-top:4px}.card .s,.small{font-size:12px;color:var(--muted)}.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}.panel{margin-bottom:12px}.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px}.head h2,.head h3{margin:0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:860px}th,td{padding:10px;border-bottom:1px solid #eef0f3;text-align:left;font-size:13px;vertical-align:top}th{font-size:12px;color:#475467;background:#fafbfc}.danger{color:var(--bad);font-weight:700}.ok{color:var(--ok);font-weight:700}.quick{display:flex;gap:8px;flex-wrap:wrap}.empty{text-align:center;padding:30px;color:var(--muted)}.roomgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.room{border:1px solid var(--line);border-radius:14px;padding:13px}.rhead{display:flex;justify-content:space-between;gap:8px;font-weight:800}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}.b-ok{background:#ecfdf3;color:#067647}.b-warn{background:#fff7ed;color:#b54708}.b-blue{background:#eef4ff;color:#1d4ed8}.bar{height:9px;background:#eef2f6;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:#1d4ed8;border-radius:999px}.modal{position:fixed;inset:0;background:#10182899;display:none;align-items:center;justify-content:center;padding:16px;z-index:100}.modal.show{display:flex}.modalbox{width:min(700px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:16px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.fieldlbl{font-size:12px;font-weight:800;margin-bottom:5px;display:block}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;padding:11px 14px;border-radius:11px;display:none;z-index:200}.toast.show{display:block}@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}.roomgrid{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}}@media(max-width:720px){.toolbar{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.roomgrid{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.appbarin{align-items:flex-start}}
</style></head><body><header class="appbar"><div class="appbarin"><div class="brand"><small>HRD MEN'S PG</small><b>PG Manager</b></div><div class="actions"><button class="btn ghost" id="installBtn" style="display:none">Install App</button><button class="btn ghost" onclick="backupData()">Backup</button><button class="btn ghost" onclick="restoreInput.click()">Restore</button><input id="restoreInput" type="file" accept=".json" hidden></div></div></header><main class="wrap"><div class="toolbar"><select id="property" class="field"></select><input id="search" class="field" placeholder="Search tenant, room or phone…"><div class="quick"><button class="btn primary" onclick="openTenant()">+ Tenant</button><button class="btn" onclick="openPayment()">+ Payment</button><button class="btn" onclick="openExpense()">+ Expense</button><button class="btn" onclick="openComplaint()">+ Complaint</button></div></div><nav class="nav" id="nav"></nav><section id="cards" class="cards"></section><section id="content"></section></main><div class="modal" id="modal"><div class="modalbox"><div class="head"><h2 id="modalTitle">Form</h2><button class="btn" onclick="closeModal()">Close</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast"></div><script src="tenant-data.js"></script><script>
const KEY='hrd_pg_manager_v1';const base=structuredClone(window.HRD_SEED||{properties:[],tenants:[]});let db=loadDB(),view='dashboard',q='';const $=id=>document.getElementById(id);function loadDB(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.tenants))return s}catch(e){}return{properties:base.properties,tenants:base.tenants,rooms:[],payments:[],expenses:[],complaints:[],updatedAt:new Date().toISOString()}}function save(){db.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(db))}function money(n){return'₹'+Math.round(Number(n)||0).toLocaleString('en-IN')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function init(){renderProps();renderNav();render();restoreInput.addEventListener('change',restoreData);$('search').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();render()});$('property').addEventListener('change',render)}function renderProps(){property.innerHTML='<option value="ALL">All Properties</option>'+db.properties.map(p=>`<option>${esc(p)}</option>`).join('')}function renderNav(){nav.innerHTML=['dashboard','tenants','rooms','payments','expenses','complaints','reports'].map(v=>`<button class="${view===v?'active':''}" onclick="setView('${v}')">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}function setView(v){view=v;renderNav();render()}function filtered(){const p=property.value||'ALL';return db.tenants.filter(t=>(p==='ALL'||t.property===p)&&(!q||[t.name,t.phone,t.room,t.property].join(' ').toLowerCase().includes(q)))}function render(){const ts=filtered(),allP=property.value==='ALL',totalD=ts.reduce((a,t)=>a+Number(t.dues||0),0),coll=ts.reduce((a,t)=>a+Number(t.collection||0),0),rent=ts.reduce((a,t)=>a+Number(t.rent||0),0);cards.innerHTML=[['Tenants',ts.length,'active records'],['Monthly Rent',money(rent),'current listed rent'],['Pending Dues',money(totalD),totalD?'follow up needed':'all clear'],['Collections',money(coll),'recorded to date'],['Rooms',roomCount(ts),'occupied room records'],['Complaints',db.complaints.filter(c=>(allP||c.property===property.value)&&c.status!=='Resolved').length,'open / pending']].map(x=>`<div class="card"><div class="k">${x[0]}</div><div class="v">${x[1]}</div><div class="s">${x[2]}</div></div>`).join('');({dashboard:()=>renderDashboard(ts),tenants:()=>renderTenants(ts),rooms:()=>renderRooms(ts),payments:renderPayments,expenses:renderExpenses,complaints:renderComplaints,reports:()=>renderReports(ts)})[view]()}function roomCount(ts){return new Set(ts.map(t=>t.property+'|'+t.room)).size}function renderDashboard(ts){const due=ts.slice().sort((a,b)=>(b.dues||0)-(a.dues||0)).slice(0,10);content.innerHTML=`<div class="grid2"><div class="panel"><div class="head"><h2>Property overview</h2><span class="small">${new Date(db.updatedAt).toLocaleString('en-IN')}</span></div>${db.properties.map(p=>{const x=db.tenants.filter(t=>t.property===p),d=x.reduce((a,t)=>a+Number(t.dues||0),0),c=x.reduce((a,t)=>a+Number(t.collection||0),0);return`<div style="margin-bottom:13px"><div class="head" style="margin-bottom:5px"><b>${esc(p)}</b><span class="small">${x.length} tenants · ${money(d)} dues</span></div><div class="bar"><i style="width:${Math.min(100,(c/(c+d||1))*100)}%"></i></div><div class="small" style="margin-top:4px">${money(c)} collection recorded</div></div>`}).join('')}</div><div class="panel"><div class="head"><h2>Highest dues</h2></div><div class="tablewrap"><table><thead><tr><th>Tenant</th><th>Room</th><th>Due</th></tr></thead><tbody>${due.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.room)}</td><td class="${t.dues>0?'danger':'ok'}">${money(t.dues)}</td></tr>`).join('')}</tbody></table></div></div></div>`}function renderTenants(ts){content.innerHTML=`<div class="panel"><div class="head"><h2>Tenants</h2><span class="small">${ts.length} shown</span></div><div class="tablewrap"><table><thead><tr><th>Name</th><th>Property</th><th>Room</th><th>Phone</th><th>Joined</th><th>Rent</th><th>Due</th><th>Collection</th><th>Action</th></tr></thead><tbody>${ts.length?ts.map(t=>`<tr><td><b>${esc(t.name)}</b><div class="small">${esc(t.email||'')}</div></td><td>${esc(t.property)}</td><td>${esc(t.room)}<div class="small">${esc(t.sharing)}</div></td><td><a href="tel:${esc(t.phone)}">${esc(t.phone)}</a></td><td>${esc(t.joined)}</td><td>${money(t.rent)}</td><td class="${t.dues>0?'danger':'ok'}">${money(t.dues)}</td><td>${money(t.collection)}</td><td><div class="quick"><button class="btn" onclick="editTenant('${t.id}')">Edit</button><button class="btn" onclick="payFor('${t.id}')">Pay</button><button class="btn" onclick="wa('${t.phone}','${String(t.name).replace(/'/g,"\\'")}')">WhatsApp</button></div></td></tr>`).join(''):`<tr><td colspan="9" class="empty">No tenants found.</td></tr>`}</tbody></table></div></div>`}function parseCap(s){const m=String(s||'').match(/\d+/);return m?Number(m[0]):1}function renderRooms(ts){const map={};ts.forEach(t=>{const k=t.property+'|'+t.room;if(!map[k])map[k]={property:t.property,room:t.room,cap:parseCap(t.sharing),names:[]};map[k].names.push(t.name)});const rooms=Object.values(map);content.innerHTML=`<div class="panel"><div class="head"><h2>Rooms & occupancy</h2><span class="small">${rooms.length} occupied room records</span></div><div class="roomgrid">${rooms.sort((a,b)=>a.room.localeCompare(b.room,undefined,{numeric:true})).map(r=>`<div class="room"><div class="rhead"><span>${esc(r.room)}</span><span class="badge ${r.names.length>=r.cap?'b-ok':'b-blue'}">${r.names.length}/${r.cap}</span></div><div class="small">${esc(r.property)}</div>${r.names.map(n=>`<div class="small">• ${esc(n)}</div>`).join('')}</div>`).join('')}</div></div>`}function filterByProp(arr){const p=property.value||'ALL';return arr.filter(x=>p==='ALL'||x.property===p)}function renderPayments(){const p=filterByProp(db.payments);content.innerHTML=`<div class="panel"><div class="head"><h2>Payments</h2><button class="btn primary" onclick="openPayment()">+ Add payment</button></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Tenant</th><th>Property</th><th>Amount</th><th>Mode</th><th>Note</th></tr></thead><tbody>${p.length?p.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.tenantName)}</td><td>${esc(x.property)}</td><td><b>${money(x.amount)}</b></td><td>${esc(x.mode)}</td><td>${esc(x.note||'')}</td></tr>`).join(''):`<tr><td colspan="6" class="empty">No payments recorded yet.</td></tr>`}</tbody></table></div></div>`}function renderExpenses(){const p=filterByProp(db.expenses),total=p.reduce((a,x)=>a+Number(x.amount||0),0);content.innerHTML=`<div class="panel"><div class="head"><div><h2>Expenses</h2><div class="small">Total recorded: ${money(total)}</div></div><button class="btn primary" onclick="openExpense()">+ Add expense</button></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Property</th><th>Category</th><th>Amount</th><th>Note</th></tr></thead><tbody>${p.length?p.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.property)}</td><td>${esc(x.category)}</td><td><b>${money(x.amount)}</b></td><td>${esc(x.note||'')}</td></tr>`).join(''):`<tr><td colspan="5" class="empty">No expenses recorded.</td></tr>`}</tbody></table></div></div>`}function renderComplaints(){const p=filterByProp(db.complaints);content.innerHTML=`<div class="panel"><div class="head"><h2>Complaints</h2><button class="btn primary" onclick="openComplaint()">+ New complaint</button></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Tenant</th><th>Room</th><th>Issue</th><th>Status</th><th>Action</th></tr></thead><tbody>${p.length?p.slice().sort((a,b)=>b.created.localeCompare(a.created)).map(x=>`<tr><td>${esc(x.created)}</td><td>${esc(x.tenantName)}</td><td>${esc(x.room)}</td><td>${esc(x.issue)}</td><td><span class="badge ${x.status==='Resolved'?'b-ok':x.status==='In Progress'?'b-blue':'b-warn'}">${esc(x.status)}</span></td><td><button class="btn" onclick="cycleComplaint('${x.id}')">Change status</button></td></tr>`).join(''):`<tr><td colspan="6" class="empty">No complaints recorded.</td></tr>`}</tbody></table></div></div>`}function renderReports(ts){const p=filterByProp(db.expenses),pay=filterByProp(db.payments),complaints=filterByProp(db.complaints);content.innerHTML=`<div class="grid2"><div class="panel"><div class="head"><h2>Management report</h2><button class="btn" onclick="window.print()">Print</button></div><table><tbody><tr><th>Tenants</th><td>${ts.length}</td></tr><tr><th>Monthly listed rent</th><td>${money(ts.reduce((a,t)=>a+Number(t.rent||0),0))}</td></tr><tr><th>Pending dues</th><td>${money(ts.reduce((a,t)=>a+Number(t.dues||0),0))}</td></tr><tr><th>Historical collections</th><td>${money(ts.reduce((a,t)=>a+Number(t.collection||0),0))}</td></tr><tr><th>Payments entered in app</th><td>${money(pay.reduce((a,x)=>a+Number(x.amount||0),0))}</td></tr><tr><th>Expenses entered in app</th><td>${money(p.reduce((a,x)=>a+Number(x.amount||0),0))}</td></tr><tr><th>Open complaints</th><td>${complaints.filter(x=>x.status!=='Resolved').length}</td></tr></tbody></table></div><div class="panel"><div class="head"><h2>Data tools</h2></div><p class="small">Tenant master, edits, payments, expenses and complaints are saved in this browser and included in backups.</p><div class="quick"><button class="btn primary" onclick="backupData()">Export full backup</button><button class="btn" onclick="resetToMaster()">Restore original tenant master</button></div><p class="small">Latest save: ${new Date(db.updatedAt).toLocaleString('en-IN')}</p></div></div>`}function propOptions(selected){return db.properties.map(p=>`<option ${selected===p?'selected':''}>${esc(p)}</option>`).join('')}function tenantOptions(selected){return db.tenants.map(t=>`<option value="${t.id}" ${selected===t.id?'selected':''}>${esc(t.name)} — ${esc(t.room)} — ${esc(t.property)}</option>`).join('')}function openModal(title,body){modalTitle.textContent=title;modalBody.innerHTML=body;modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}function openTenant(t){const x=t||{id:'',property:property.value!=='ALL'?property.value:db.properties[0],name:'',room:'',sharing:'',joined:'',phone:'',rent:'',deposit:'',dues:'',collection:'',lastPayment:'',email:''};openModal(t?'Edit tenant':'Add tenant',`<div class="formgrid"><label><span class="fieldlbl">Property</span><select id="fprop" class="field">${propOptions(x.property)}</select></label><label><span class="fieldlbl">Name</span><input id="fname" class="field" value="${esc(x.name)}"></label><label><span class="fieldlbl">Room</span><input id="froom" class="field" value="${esc(x.room)}"></label><label><span class="fieldlbl">Sharing</span><input id="fshare" class="field" value="${esc(x.sharing)}"></label><label><span class="fieldlbl">Joining date</span><input id="fjoin" class="field" value="${esc(x.joined)}"></label><label><span class="fieldlbl">Phone</span><input id="fphone" class="field" value="${esc(x.phone)}"></label><label><span class="fieldlbl">Monthly rent</span><input id="frent" type="number" class="field" value="${x.rent}"></label><label><span class="fieldlbl">Deposit</span><input id="fdep" type="number" class="field" value="${x.deposit}"></label><label><span class="fieldlbl">Pending dues</span><input id="fdues" type="number" class="field" value="${x.dues}"></label><label><span class="fieldlbl">Collection to date</span><input id="fcoll" type="number" class="field" value="${x.collection}"></label><label><span class="fieldlbl">Last payment</span><input id="flast" class="field" value="${esc(x.lastPayment)}"></label><label><span class="fieldlbl">Email</span><input id="femail" class="field" value="${esc(x.email||'')}"></label></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveTenant('${x.id}')">Save tenant</button></div>`)}function saveTenant(id){const x={id:id||'T'+String(Date.now()).slice(-8),property:fprop.value,name:fname.value.trim(),room:froom.value.trim(),sharing:fshare.value.trim(),joined:fjoin.value.trim(),phone:fphone.value.trim(),rent:Number(frent.value||0),deposit:Number(fdep.value||0),dues:Number(fdues.value||0),collection:Number(fcoll.value||0),lastPayment:flast.value.trim(),email:femail.value.trim()};if(!x.name){toast('Tenant name is required');return}const i=db.tenants.findIndex(t=>t.id===id);if(i<0)db.tenants.push(x);else db.tenants[i]=x;save();closeModal();render();toast(i<0?'Tenant added':'Tenant updated')}function editTenant(id){const t=db.tenants.find(x=>x.id===id);if(t)openTenant(t)}function payFor(id){openPayment(id)}function openPayment(id){const t=db.tenants.find(x=>x.id===id)||db.tenants[0];openModal('Add payment',`<div class="formgrid"><label class="full"><span class="fieldlbl">Tenant</span><select id="ptenant" class="field">${tenantOptions(t?.id)}</select></label><label><span class="fieldlbl">Amount</span><input id="pamount" type="number" class="field"></label><label><span class="fieldlbl">Date</span><input id="pdate" type="date" class="field" value="${new Date().toISOString().slice(0,10)}"></label><label><span class="fieldlbl">Mode</span><select id="pmode" class="field"><option>UPI</option><option>Cash</option><option>Bank Transfer</option><option>Card</option><option>Other</option></select></label><label><span class="fieldlbl">Note</span><input id="pnote" class="field"></label></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="savePayment()">Save payment</button></div>`)}function savePayment(){const t=db.tenants.find(x=>x.id===ptenant.value),amt=Number(pamount.value||0);if(!t||amt<=0){toast('Select tenant and enter amount');return}db.payments.push({id:'P'+Date.now(),tenantId:t.id,tenantName:t.name,property:t.property,amount:amt,date:pdate.value,mode:pmode.value,note:pnote.value.trim()});t.collection=Number(t.collection||0)+amt;t.dues=Math.max(0,Number(t.dues||0)-amt);t.lastPayment=new Date(pdate.value).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});save();closeModal();render();toast('Payment saved')}function openExpense(){openModal('Add expense',`<div class="formgrid"><label><span class="fieldlbl">Property</span><select id="eprop" class="field">${propOptions(property.value!=='ALL'?property.value:db.properties[0])}</select></label><label><span class="fieldlbl">Date</span><input id="edate" type="date" class="field" value="${new Date().toISOString().slice(0,10)}"></label><label><span class="fieldlbl">Category</span><input id="ecat" class="field" placeholder="Electricity / Repairs / Salary"></label><label><span class="fieldlbl">Amount</span><input id="eamount" type="number" class="field"></label><label class="full"><span class="fieldlbl">Note</span><textarea id="enote" class="field" rows="3"></textarea></label></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveExpense()">Save expense</button></div>`)}function saveExpense(){const amt=Number(eamount.value||0);if(amt<=0){toast('Enter an amount');return}db.expenses.push({id:'E'+Date.now(),property:eprop.value,date:edate.value,category:ecat.value.trim()||'Other',amount:amt,note:enote.value.trim()});save();closeModal();render();toast('Expense saved')}function openComplaint(){openModal('New complaint',`<div class="formgrid"><label class="full"><span class="fieldlbl">Tenant</span><select id="ctenant" class="field">${tenantOptions()}</select></label><label class="full"><span class="fieldlbl">Issue</span><textarea id="cissue" class="field" rows="4"></textarea></label><label><span class="fieldlbl">Status</span><select id="cstatus" class="field"><option>Open</option><option>In Progress</option><option>Resolved</option></select></label></div><div class="modalfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveComplaint()">Save complaint</button></div>`)}function saveComplaint(){const t=db.tenants.find(x=>x.id===ctenant.value);if(!t||!cissue.value.trim()){toast('Select tenant and enter issue');return}db.complaints.push({id:'C'+Date.now(),tenantId:t.id,tenantName:t.name,property:t.property,room:t.room,issue:cissue.value.trim(),status:cstatus.value,created:new Date().toISOString().slice(0,10)});save();closeModal();render();toast('Complaint saved')}function cycleComplaint(id){const x=db.complaints.find(c=>c.id===id);if(!x)return;x.status=x.status==='Open'?'In Progress':x.status==='In Progress'?'Resolved':'Open';save();render();toast('Status updated')}function wa(phone,name){const p=String(phone||'').replace(/\D/g,'');if(!p){toast('No phone number');return}window.open('https://wa.me/91'+p+'?text='+encodeURIComponent('Hello '+name+', this is HRD PG. Please contact the office regarding your PG account.'),'_blank')}function backupData(){const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='hrd-pg-manager-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('Backup downloaded')}function restoreData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.tenants)throw Error();db=x;save();renderProps();render();toast('Backup restored')}catch(_){toast('Invalid backup file')}};r.readAsText(f);e.target.value=''}function resetToMaster(){if(!confirm('Restore the original 265-tenant master? Your added payments, expenses and complaints will remain, but tenant edits will be replaced.'))return;db.tenants=structuredClone(base.tenants);save();render();toast('Tenant master restored')}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.deferredPrompt=e;installBtn.style.display='inline-block'});installBtn.onclick=async()=>{if(window.deferredPrompt){window.deferredPrompt.prompt();window.deferredPrompt=null}};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});init();
