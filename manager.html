<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f172a"><title>HRD PG Manager Console</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#f1f5f9;color:#0f172a}header{background:#0f172a;color:#fff;padding:16px;position:sticky;top:0;z-index:10}header b{font-size:21px}header small{display:block;opacity:.7}.wrap{max-width:1200px;margin:auto;padding:14px}.toolbar,.nav,.row,.cards{display:flex;gap:9px;flex-wrap:wrap}.toolbar{margin-bottom:12px}.toolbar>*{flex:1;min-width:180px}select,input,button,textarea{font:inherit}select,input,textarea{padding:11px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}button{padding:10px 13px;border:0;border-radius:10px;background:#0f172a;color:#fff;font-weight:700;cursor:pointer}.nav{overflow:auto;margin-bottom:12px}.nav button{background:#e2e8f0;color:#111827;white-space:nowrap}.nav button.on{background:#0f172a;color:#fff}.cards{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:12px}.card,.panel{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 10px #0000000b}.card span,.muted{display:block;color:#64748b;font-size:12px}.card b{font-size:22px}.panel{margin-bottom:12px}.panel h2{margin:0 0 10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.table{overflow:auto}table{width:100%;min-width:760px;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px}th{background:#f8fafc}.danger{color:#b91c1c;font-weight:700}.good{color:#15803d;font-weight:700}.hidden{display:none}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#e2e8f0;font-size:11px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:14px;z-index:20}.modal>div{background:#fff;border-radius:15px;padding:16px;width:min(560px,100%);max-height:90vh;overflow:auto}.modal.show{display:flex}.form{display:grid;gap:9px}@media(max-width:760px){.cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}</style></head><body><header><small>HRD MEN'S PG</small><b>Manager Console</b></header><div class="wrap"><div class="toolbar"><select id="property"></select><input id="search" placeholder="Search tenant, room or phone"><button onclick="backup()">Backup</button><button onclick="restoreClick()">Restore</button><input id="restore" type="file" accept="application/json" class="hidden"></div><div class="nav" id="nav"><button data-v="dashboard" class="on">Dashboard</button><button data-v="tenants">Tenants</button><button data-v="payments">Payments</button><button data-v="expenses">Expenses</button><button data-v="complaints">Complaints</button><button data-v="rooms">Rooms</button></div><div id="cards" class="cards"></div><div id="content"></div></div><div class="modal" id="modal"><div id="modalBody"></div></div><script>
let DATA={properties:[],tenants:[]};let view='dashboard';let extras=JSON.parse(localStorage.getItem('hrd_ops')||'{"payments":[],"expenses":[],"complaints":[]}');
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
async function loadSeed(){try{let h=await fetch('index.html?x='+Date.now()).then(r=>r.text());let m=h.match(/const seed\s*=\s*(\{[\s\S]*?\});/);if(m)DATA=JSON.parse(m[1]);else{let m2=h.match(/const TENANTS=([\s\S]*?);/);if(m2){let t=JSON.parse(m2[1]);DATA.tenants=t;DATA.properties=[...new Set(t.map(x=>x.property))]}}}catch(e){console.error(e)}}
function save(){localStorage.setItem('hrd_ops',JSON.stringify(extras))}function filtered(){let p=property.value,s=search.value.toLowerCase();return DATA.tenants.filter(t=>(!p||t.property===p)&&(!s||[t.name,t.room,t.phone,t.property].join(' ').toLowerCase().includes(s)))}
function cards(arr){let dues=arr.reduce((a,t)=>a+Number(t.dues||0),0),coll=arr.reduce((a,t)=>a+Number(t.collection||0),0);return `<div class="card"><span>Tenants</span><b>${arr.length}</b></div><div class="card"><span>Pending dues</span><b>${money(dues)}</b></div><div class="card"><span>Reported collection</span><b>${money(coll)}</b></div><div class="card"><span>Recorded payments</span><b>${money(extras.payments.reduce((a,x)=>a+Number(x.amount||0),0))}</b></div>`}
function table(rows){return `<div class="table"><table><thead><tr><th>Tenant</th><th>Property</th><th>Room</th><th>Phone</th><th>Rent</th><th>Pending</th><th>Collection</th><th>Last payment</th></tr></thead><tbody>${rows.map(t=>`<tr><td><b>${t.name||''}</b></td><td>${t.property||''}</td><td>${t.room||''}</td><td>${t.phone||''}</td><td>${money(t.rent)}</td><td class="${Number(t.dues||0)>0?'danger':''}">${money(t.dues)}</td><td>${money(t.collection)}</td><td>${t.lastPayment||''}</td></tr>`).join('')}</tbody></table></div>`}
function render(){let arr=filtered();cardsEl.innerHTML=cards(arr);let html='';if(view==='dashboard')html=`<div class="panel"><h2>Operations</h2><div class="grid2"><div><b>High pending dues</b><p class="muted">${arr.filter(t=>Number(t.dues||0)>5000).length} tenants have more than ₹5,000 pending.</p></div><div><b>Quick actions</b><p><button onclick="openPayment()">Record payment</button> <button onclick="openExpense()">Add expense</button> <button onclick="openComplaint()">Add complaint</button></p></div></div></div><div class="panel"><h2>Tenant master</h2>${table(arr.slice(0,30))}</div>`;
if(view==='tenants')html=`<div class="panel"><h2>Tenants <span class="pill">${arr.length}</span></h2>${table(arr)}</div>`;
if(view==='payments')html=`<div class="panel"><div class="row" style="justify-content:space-between"><h2>Payments</h2><button onclick="openPayment()">+ Record payment</button></div>${extras.payments.length?`<div class="table"><table><thead><tr><th>Date</th><th>Tenant</th><th>Amount</th><th>Mode</th><th>Note</th></tr></thead><tbody>${extras.payments.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${x.tenant}</td><td>${money(x.amount)}</td><td>${x.mode}</td><td>${x.note||''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="muted">No new payments recorded yet.</div>'}</div>`;
if(view==='expenses')html=`<div class="panel"><div class="row" style="justify-content:space-between"><h2>Expenses</h2><button onclick="openExpense()">+ Add expense</button></div>${extraTable(extras.expenses,['date','category','amount','note'])}</div>`;
if(view==='complaints')html=`<div class="panel"><div class="row" style="justify-content:space-between"><h2>Complaints</h2><button onclick="openComplaint()">+ Add complaint</button></div>${extraTable(extras.complaints,['date','tenant','issue','status'])}</div>`;
if(view==='rooms'){let mp={};arr.forEach(t=>{let k=t.property+' / '+t.room;(mp[k]??={property:t.property,room:t.room,tenants:[]}).tenants.push(t)});html=`<div class="panel"><h2>Rooms & occupancy</h2>${Object.values(mp).map(r=>`<div class="room"><div><b>${r.room}</b><div class="muted">${r.property}</div></div><div><span class="pill">${r.tenants.length} active tenant${r.tenants.length===1?'':'s'}</span></div></div>`).join('')}</div>`}content.innerHTML=html}
function extraTable(rows,keys){if(!rows.length)return '<div class="muted">No records yet.</div>';return `<div class="table"><table><thead><tr>${keys.map(k=>`<th>${k}</th>`).join('')}</tr></thead><tbody>${rows.slice().reverse().map(r=>`<tr>${keys.map(k=>`<td>${k==='amount'?money(r[k]):(r[k]||'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function close(){modal.classList.remove('show')}function form(title,body,submit){modalBody.innerHTML=`<div class="row" style="justify-content:space-between"><h2>${title}</h2><button onclick="close()">Close</button></div><div class="form">${body}<button onclick="${submit}">Save</button></div>`;modal.classList.add('show')}
function tenantSelect(id='tenantSel'){return `<select id="${id}">${DATA.tenants.map(t=>`<option value="${t.id}">${t.name} — ${t.property} — ${t.room}</option>`).join('')}</select>`}
function openPayment(){form('Record payment',`${tenantSelect()}<input id="amt" type="number" placeholder="Amount"/><select id="mode"><option>Cash</option><option>UPI</option><option>Bank</option><option>Other</option></select><input id="pdate" type="date" value="${new Date().toISOString().slice(0,10)}"/><input id="note" placeholder="Note / receipt no."/>`,`extras.payments.push({date:pdate.value,tenant:DATA.tenants.find(t=>t.id===tenantSel.value)?.name||'',amount:Number(amt.value||0),mode:mode.value,note:note.value});save();close();render()`) }
function openExpense(){form('Add expense',`<input id="edate" type="date" value="${new Date().toISOString().slice(0,10)}"/><input id="cat" placeholder="Category (electricity, food, repair...)"/><input id="eamt" type="number" placeholder="Amount"/><input id="enote" placeholder="Note"/>`,`extras.expenses.push({date:edate.value,category:cat.value,amount:Number(eamt.value||0),note:enote.value});save();close();render()`) }
function openComplaint(){form('Add complaint',`${tenantSelect('ctenant')}<input id="issue" placeholder="Issue"/><select id="status"><option>Open</option><option>In Progress</option><option>Resolved</option></select><input id="cdate" type="date" value="${new Date().toISOString().slice(0,10)}"/>`,`extras.complaints.push({date:cdate.value,tenant:DATA.tenants.find(t=>t.id===ctenant.value)?.name||'',issue:issue.value,status:status.value});save();close();render()`) }
function backup(){let blob=new Blob([JSON.stringify({DATA,extras},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hrd-pg-backup.json';a.click()}function restoreClick(){restore.click()}restore.onchange=async()=>{let f=restore.files[0];if(!f)return;let x=JSON.parse(await f.text());if(x.extras){extras=x.extras;save();render();alert('Restored operations data')}}
nav.onclick=e=>{let b=e.target.closest('button[data-v]');if(!b)return;view=b.dataset.v;document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render()};search.oninput=render;property.onchange=render;const cardsEl=document.getElementById('cards'),content=document.getElementById('content');loadSeed().then(()=>{property.innerHTML='<option value="">All properties</option>'+DATA.properties.map(p=>`<option>${p}</option>`).join('');render()});
</script></body></html>
