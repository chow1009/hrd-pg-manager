<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HRD PG Cloud Manager</title><style>body{font-family:system-ui;margin:0;background:#f1f5f9;color:#0f172a}header{background:#0f172a;color:#fff;padding:18px}main{max-width:1100px;margin:auto;padding:14px}.panel{background:#fff;border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #0001}input,select,button{padding:11px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}input,select{width:100%;box-sizing:border-box}button{background:#0f172a;color:#fff;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#fff;padding:13px;border-radius:14px}.muted{color:#64748b;font-size:12px}.ok{color:#15803d}.bad{color:#b91c1c}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px}th{background:#f8fafc}@media(max-width:700px){.grid,.cards{grid-template-columns:1fr 1fr}}</style></head><body><header><b>HRD MEN'S PG — Cloud Manager</b><div class="muted" style="color:#cbd5e1">Supabase-backed operations</div></header><main>
<div id="setup" class="panel"><h2>Connect Cloud Database</h2><p class="muted">Create a Supabase project, run <b>supabase_schema_hrd.sql</b>, then enter the project URL and public anon key below. Never enter a service-role key.</p><div class="grid"><div><label>Supabase URL</label><input id="url" placeholder="https://xxxx.supabase.co"></div><div><label>Public anon key</label><input id="key" placeholder="eyJ..."></div></div><br><button onclick="saveCfg()">Connect & Save</button> <button onclick="clearCfg()">Clear</button><div id="msg" class="muted" style="margin-top:10px"></div></div>
<div id="app" style="display:none"><div class="nav"><button onclick="loadAll()">Refresh</button><button onclick="showForm('payment')">Add Payment</button><button onclick="showForm('expense')">Add Expense</button><button onclick="showForm('complaint')">Add Complaint</button><button onclick="disconnect()">Disconnect</button></div><div class="cards" id="cards"></div><div class="panel"><input id="search" placeholder="Search tenant name, room, phone" oninput="renderTenants()"></div><div class="panel"><h2>Tenants</h2><div class="table"><table><thead><tr><th>Name</th><th>Property</th><th>Room</th><th>Phone</th><th>Rent</th><th>Dues</th><th>Collection</th></tr></thead><tbody id="tenants"></tbody></table></div></div><div id="form"></div></div></main>
<script>
let cfg=JSON.parse(localStorage.getItem('hrd_supabase')||'null'), tenants=[]; const headers=()=>({'apikey':cfg.key,'Authorization':'Bearer '+cfg.key,'Content-Type':'application/json'}); async function api(path,opt={}){let r=await fetch(cfg.url+'/rest/v1/'+path,{...opt,headers:{...headers(),...(opt.headers||{})}}); if(!r.ok) throw new Error(await r.text()); return r.status===204?[]:r.json()}
function saveCfg(){cfg={url:document.getElementById('url').value.trim().replace(/\/$/,''),key:document.getElementById('key').value.trim()}; if(!cfg.url||!cfg.key){msg.textContent='Enter both values';return}localStorage.setItem('hrd_supabase',JSON.stringify(cfg));connect()}
function clearCfg(){localStorage.removeItem('hrd_supabase');location.reload()} function disconnect(){clearCfg()}
async function connect(){try{tenants=await api('tenants?select=*&order=property.asc,name.asc&limit=1000');app.style.display='block';setup.style.display='none';renderCards();renderTenants()}catch(e){msg.textContent='Connection error: '+e.message}}
async function loadAll(){tenants=await api('tenants?select=*&order=property.asc,name.asc&limit=1000');renderCards();renderTenants()}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')} function renderCards(){let dues=tenants.reduce((a,x)=>a+Number(x.dues||0),0), col=tenants.reduce((a,x)=>a+Number(x.collection||0),0);cards.innerHTML=`<div class=card><span class=muted>Tenants</span><b>${tenants.length}</b></div><div class=card><span class=muted>Pending Dues</span><b class=bad>${money(dues)}</b></div><div class=card><span class=muted>Total Collection</span><b class=ok>${money(col)}</b></div><div class=card><span class=muted>Properties</span><b>${new Set(tenants.map(x=>x.property)).size}</b></div>`}
function renderTenants(){let s=(search.value||'').toLowerCase();let a=tenants.filter(x=>[x.name,x.property,x.room,x.phone].join(' ').toLowerCase().includes(s));document.getElementById('tenants').innerHTML=a.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.property)}</td><td>${esc(x.room)}</td><td>${esc(x.phone)}</td><td>${money(x.rent)}</td><td class=${Number(x.dues||0)>0?'bad':''}>${money(x.dues)}</td><td>${money(x.collection)}</td></tr>`).join('')}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function showForm(t){let html=''; if(t==='payment')html=`<div class=panel><h2>Add Payment</h2><div class=grid><input id=fTenant placeholder="Tenant name"><input id=fAmount type=number placeholder="Amount"><input id=fDate type=date><select id=fMode><option>Cash</option><option>UPI</option><option>Bank</option><option>Card</option></select><input id=fNote placeholder="Note"></div><br><button onclick="addPayment()">Save Payment</button></div>`; if(t==='expense')html=`<div class=panel><h2>Add Expense</h2><div class=grid><input id=eProp placeholder="Property"><input id=eCat placeholder="Category"><input id=eAmount type=number placeholder="Amount"><input id=eDate type=date><input id=eNote placeholder="Note"></div><br><button onclick="addExpense()">Save Expense</button></div>`; if(t==='complaint')html=`<div class=panel><h2>Add Complaint</h2><div class=grid><input id=cTenant placeholder="Tenant name"><input id=cProp placeholder="Property"><input id=cRoom placeholder="Room"><input id=cIssue placeholder="Issue"></div><br><button onclick="addComplaint()">Save Complaint</button></div>`; document.getElementById('form').innerHTML=html}
async function addPayment(){await api('payments',{method:'POST',body:JSON.stringify({tenant_name:fTenant.value,amount:Number(fAmount.value||0),payment_date:fDate.value||new Date().toISOString().slice(0,10),mode:fMode.value,note:fNote.value})});document.getElementById('form').innerHTML='<div class=panel><b>Payment saved.</b></div>'}
async function addExpense(){await api('expenses',{method:'POST',body:JSON.stringify({property:eProp.value,category:eCat.value,amount:Number(eAmount.value||0),expense_date:eDate.value||new Date().toISOString().slice(0,10),note:eNote.value})});document.getElementById('form').innerHTML='<div class=panel><b>Expense saved.</b></div>'}
async function addComplaint(){await api('complaints',{method:'POST',body:JSON.stringify({tenant_name:cTenant.value,property:cProp.value,room:cRoom.value,issue:cIssue.value})});document.getElementById('form').innerHTML='<div class=panel><b>Complaint saved.</b></div>'}
if(cfg){document.getElementById('url').value=cfg.url;document.getElementById('key').value=cfg.key;connect()}
</script></body></html>
