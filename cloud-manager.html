<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HRD PG Cloud Manager</title><style>body{font-family:system-ui;margin:0;background:#f1f5f9;color:#0f172a}header{background:#0f172a;color:#fff;padding:18px}main{max-width:1100px;margin:auto;padding:14px}.panel{background:#fff;border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #0001}input,select,button{padding:11px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}input,select{width:100%;box-sizing:border-box}button{background:#0f172a;color:#fff;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#fff;padding:13px;border-radius:14px}.muted{color:#64748b;font-size:12px}.ok{color:#15803d}.bad{color:#b91c1c}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px}th{background:#f8fafc}.hidden{display:none}@media(max-width:700px){.grid,.cards{grid-template-columns:1fr 1fr}}</style></head><body><header><b>HRD MEN'S PG — Cloud Manager</b><div class="muted" style="color:#cbd5e1">Supabase-backed operations</div></header><main>
<div id="setup" class="panel"><h2>Cloud Setup</h2><p class="muted">1) Create a Supabase project. 2) Run <b>supabase_schema_hrd.sql</b>. 3) Enter the project URL and public anon key. Never use a service-role key.</p><div class="grid"><div><label>Supabase URL</label><input id="url" placeholder="https://xxxx.supabase.co"></div><div><label>Public anon key</label><input id="key" placeholder="eyJ..."></div></div><br><div class="grid"><div><label>Email</label><input id="email" type="email" placeholder="admin@example.com"></div><div><label>Password</label><input id="password" type="password" placeholder="••••••••"></div></div><br><button onclick="signup()">Create Account</button> <button onclick="login()">Login</button> <button onclick="clearCfg()">Clear</button><div id="msg" class="muted" style="margin-top:10px"></div></div>
<div id="app" class="hidden"><div class="nav"><button onclick="loadAll()">Refresh</button><button onclick="importMaster()">Import/Refresh 265 Master Tenants</button><button onclick="showForm('payment')">Add Payment</button><button onclick="showForm('expense')">Add Expense</button><button onclick="showForm('complaint')">Add Complaint</button><button onclick="logout()">Logout</button></div><div class="cards" id="cards"></div><div class="panel"><input id="search" placeholder="Search tenant name, room, phone" oninput="renderTenants()"></div><div class="panel"><h2>Tenants</h2><div class="table"><table><thead><tr><th>Name</th><th>Property</th><th>Room</th><th>Phone</th><th>Rent</th><th>Dues</th><th>Collection</th></tr></thead><tbody id="tenants"></tbody></table></div></div><div id="form"></div></div></main>
<script>
let cfg=JSON.parse(localStorage.getItem('hrd_supabase_cfg')||'null'), token=localStorage.getItem('hrd_supabase_token')||'', tenants=[];
const base=()=>cfg.url.replace(/\/$/,''); const hdr=()=>({'apikey':cfg.key,'Authorization':'Bearer '+token,'Content-Type':'application/json'});
async function rest(path,opt={}){let r=await fetch(base()+'/rest/v1/'+path,{...opt,headers:{...hdr(),...(opt.headers||{})}});if(!r.ok)throw new Error(await r.text());return r.status===204?[]:r.json()}
async function auth(path,body){let r=await fetch(base()+'/auth/v1/'+path,{method:'POST',headers:{apikey:cfg.key,'Content-Type':'application/json'},body:JSON.stringify(body)});let j=await r.json();if(!r.ok)throw new Error(j.msg||j.error_description||JSON.stringify(j));return j}
function saveCfg(){cfg={url:url.value.trim().replace(/\/$/,''),key:key.value.trim()};localStorage.setItem('hrd_supabase_cfg',JSON.stringify(cfg))}
async function signup(){try{saveCfg();let j=await auth('signup',{email:email.value.trim(),password:password.value});msg.textContent=j.user?'Account created. Check email if confirmation is enabled, then Login.':'Signup complete.'}catch(e){msg.textContent='Signup: '+e.message}}
async function login(){try{saveCfg();let j=await auth('token?grant_type=password',{email:email.value.trim(),password:password.value});token=j.access_token;localStorage.setItem('hrd_supabase_token',token);await connect()}catch(e){msg.textContent='Login: '+e.message}}
function clearCfg(){localStorage.removeItem('hrd_supabase_cfg');localStorage.removeItem('hrd_supabase_token');location.reload()} function logout(){clearCfg()}
async function connect(){try{await loadAll();setup.classList.add('hidden');app.classList.remove('hidden');}catch(e){msg.textContent='Cloud error: '+e.message}}
async function loadAll(){tenants=await rest('tenants?select=*&order=property.asc,name.asc&limit=1000');renderCards();renderTenants()}
async function importMaster(){try{let html=await fetch('index.html?import='+Date.now()).then(r=>r.text());let m=html.match(/const seed\s*=\s*(\{.*?\});/s);if(!m)throw Error('Master dataset not found in index.html');let seed=JSON.parse(m[1]);let clean=seed.tenants.map(x=>({property:x.property,name:x.name,room:x.room,sharing:x.sharing,joined:x.joined,phone:x.phone,rent:Number(x.rent||0),deposit:Number(x.deposit||0),dues:Number(x.dues||0),collection:Number(x.collection||0),last_payment:x.lastPayment||''}));if(!confirm('Replace cloud tenant master data with '+clean.length+' imported tenants?'))return;await rest('tenants?select=id',{method:'DELETE'});for(let i=0;i<clean.length;i+=50)await rest('tenants',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(clean.slice(i,i+50))});await loadAll();alert('Imported '+clean.length+' tenants.')}catch(e){alert('Import failed: '+e.message)}}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')} function renderCards(){let dues=tenants.reduce((a,x)=>a+Number(x.dues||0),0),col=tenants.reduce((a,x)=>a+Number(x.collection||0),0);cards.innerHTML=`<div class=card><span class=muted>Tenants</span><b>${tenants.length}</b></div><div class=card><span class=muted>Pending Dues</span><b class=bad>${money(dues)}</b></div><div class=card><span class=muted>Total Collection</span><b class=ok>${money(col)}</b></div><div class=card><span class=muted>Properties</span><b>${new Set(tenants.map(x=>x.property)).size}</b></div>`}
function renderTenants(){let s=(search.value||'').toLowerCase();let a=tenants.filter(x=>[x.name,x.property,x.room,x.phone].join(' ').toLowerCase().includes(s));document.getElementById('tenants').innerHTML=a.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${esc(x.property)}</td><td>${esc(x.room)}</td><td>${esc(x.phone)}</td><td>${money(x.rent)}</td><td class=${Number(x.dues||0)>0?'bad':''}>${money(x.dues)}</td><td>${money(x.collection)}</td></tr>`).join('')}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function showForm(t){let html='';if(t==='payment')html=`<div class=panel><h2>Add Payment</h2><div class=grid><input id=fTenant placeholder="Tenant name"><input id=fAmount type=number placeholder="Amount"><input id=fDate type=date><select id=fMode><option>Cash</option><option>UPI</option><option>Bank</option><option>Card</option></select><input id=fNote placeholder="Note"></div><br><button onclick="addPayment()">Save Payment</button></div>`;if(t==='expense')html=`<div class=panel><h2>Add Expense</h2><div class=grid><input id=eProp placeholder="Property"><input id=eCat placeholder="Category"><input id=eAmount type=number placeholder="Amount"><input id=eDate type=date><input id=eNote placeholder="Note"></div><br><button onclick="addExpense()">Save Expense</button></div>`;if(t==='complaint')html=`<div class=panel><h2>Add Complaint</h2><div class=grid><input id=cTenant placeholder="Tenant name"><input id=cProp placeholder="Property"><input id=cRoom placeholder="Room"><input id=cIssue placeholder="Issue"></div><br><button onclick="addComplaint()">Save Complaint</button></div>`;form.innerHTML=html}
async function addPayment(){await rest('payments',{method:'POST',body:JSON.stringify({tenant_name:fTenant.value,amount:Number(fAmount.value||0),payment_date:fDate.value||new Date().toISOString().slice(0,10),mode:fMode.value,note:fNote.value})});form.innerHTML='<div class=panel><b>Payment saved.</b></div>'}
async function addExpense(){await rest('expenses',{method:'POST',body:JSON.stringify({property:eProp.value,category:eCat.value,amount:Number(eAmount.value||0),expense_date:eDate.value||new Date().toISOString().slice(0,10),note:eNote.value})});form.innerHTML='<div class=panel><b>Expense saved.</b></div>'}
async function addComplaint(){await rest('complaints',{method:'POST',body:JSON.stringify({tenant_name:cTenant.value,property:cProp.value,room:cRoom.value,issue:cIssue.value})});form.innerHTML='<div class=panel><b>Complaint saved.</b></div>'}
if(cfg){url.value=cfg.url;key.value=cfg.key} if(cfg&&token)connect();
</script></body></html>
